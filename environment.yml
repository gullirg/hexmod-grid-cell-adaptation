# One environment for the analyses, the figures and the tests.
#   conda env create -f environment.yml
#   conda activate hexmod
#   pip install -e .
# The analysis pins are the versions with which the published numbers were computed.
# matplotlib and pyparsing are the versions with which the figures were drawn.
name: hexmod
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.23.5
  - scipy=1.13.0
  - pandas=1.5.3
  - scikit-image=0.20.0
  - matplotlib=3.8.0
  - pyparsing=3.0.9
  - h5py=3.7.0
  - requests
  - tqdm
  - pytest
  - pip
