# Unit tests, and Figures 6, 7 and 8 drawn from the shipped simulation results.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Create the environment from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install the package
        run: pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q -m "not results"

      - name: Figures 6, 7 and 8 from the shipped results
        env:
          HEXMOD_RESULTS: ${{ runner.temp }}/results
        run: |
          python scripts/step30_figures.py --figure Fig6 --figure Fig7 --figure Fig8 | tee "$RUNNER_TEMP/step30.log"
          grep -q "drawn: 3; skipped: none; failed: none" "$RUNNER_TEMP/step30.log"
