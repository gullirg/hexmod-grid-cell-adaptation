[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexmod"
version = "1.0.0"
description = "Analysis code for 'Firing rate adaptation in grid cells produces macroscopic hexadirectional modulation'"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "matplotlib",
    "h5py",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "results: checks the results folder of a complete run in HEXMOD_RESULTS (skipped when it is not given)",
]
